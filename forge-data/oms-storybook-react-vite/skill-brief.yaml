---
name: "oms-storybook-react-vite"
version: "10.3.5"
source_type: "source"
source_repo: "https://github.com/storybookjs/storybook"
language: "TypeScript"
description: "Authors Storybook v10 stories using the consolidated `storybook` package import surface for React+Vite authoring workflows. Covers CSF3 story authoring, `preview.ts` patterns, the React renderer, Vite builder integration, and 4 essential addons (a11y, docs, themes, vitest). Target user: day-90+ story author, not first-time installer."
forge_tier: "Deep"
created: "2026-04-11"
created_by: "armel"
scope:
  type: "specific-modules"
  include:
    - "code/core/**"
    - "code/frameworks/react-vite/**"
    - "code/builders/builder-vite/**"
    - "code/renderers/react/**"
    - "code/addons/a11y/**"
    - "code/addons/docs/**"
    - "code/addons/themes/**"
    - "code/addons/vitest/**"
    - "code/**/template/stories/**/*.stories.*"
  exclude:
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/__tests__/**"
    - "**/__mocks__/**"
    - "**/template/**/*.config.*"
    - "**/template/node_modules/**"
    - "**/scripts/**"
    - "**/dist/**"
    - "tsconfig.json"
    - "vitest.config.ts"
    - ".eslintrc.*"
    # Amended 2026-04-11 by skf-update-skill (gap-driven, GAP-005):
    # narrow the coarse `code/core/**` glob to the authoring-surface subpaths.
    # These paths are addon-panel UI primitives, Babel/CSF tooling, the
    # server/router/node-logger infrastructure, etc. — not story-authoring
    # surface. Including them inflates the stratified denominator from 216
    # to 301 and drives Export Coverage artificially from 99% to 71%.
    - "code/core/src/components/**"
    - "code/core/src/babel/**"
    - "code/core/src/csf-tools/**"
    - "code/core/src/core-server/**"
    - "code/core/src/router/**"
    - "code/core/src/node-logger/**"
    - "code/core/src/telemetry/**"
    - "code/core/src/channels/**"
    - "code/core/src/builder-manager/**"
  # Tier A (SKF 4.0.0 Export Coverage denominator): the definition files behind
  # the entry points a React+Vite story author imports. Each glob also matches
  # scope.include (a tier A glob counts only files scope.include matches).
  tier_a_include:
    # storybook/test: spyOn/fn/mocked/clearAllMocks... (spy.ts), UserEvent (testing-library.ts), sb/UserEventObject (index.ts)
    - "code/core/src/test/index.ts"
    - "code/core/src/test/spy.ts"
    - "code/core/src/test/testing-library.ts"
    # storybook/preview-api: hooks + makeDecorator, store/csf composition (composeStories, setProjectAnnotations...), preview-web classes the entry re-exports, Tag
    - "code/core/src/preview-api/index.ts"
    - "code/core/src/preview-api/modules/addons/**"
    - "code/core/src/preview-api/modules/store/**"
    - "code/core/src/preview-api/modules/preview-web/*"
    - "code/core/src/preview-api/modules/preview-web/docs-context/DocsContext.ts"
    - "code/core/src/preview-api/modules/preview-web/render/animation-utils.ts"
    - "code/core/src/shared/constants/tags.ts"
    # storybook/actions and storybook/actions/decorator (types.ts left out: its ActionsTypes reaches users only via storybook/internal/csf)
    - "code/core/src/actions/index.ts"
    - "code/core/src/actions/constants.ts"
    - "code/core/src/actions/decorator.ts"
    - "code/core/src/actions/models/**"
    - "code/core/src/actions/runtime/**"
    # storybook/theming and storybook/theming/create
    - "code/core/src/theming/**"
    # storybook/viewport
    - "code/core/src/viewport/index.ts"
    - "code/core/src/viewport/constants.ts"
    - "code/core/src/viewport/defaults.ts"
    - "code/core/src/viewport/types.ts"
    - "code/core/src/viewport/responsiveViewport.tsx"
    # storybook/highlight
    - "code/core/src/highlight/index.ts"
    - "code/core/src/highlight/constants.ts"
    - "code/core/src/highlight/types.ts"
    # @storybook/react-vite (FrameworkOptions, StorybookConfig) and @storybook/react-vite/node (defineMain)
    - "code/frameworks/react-vite/src/index.ts"
    - "code/frameworks/react-vite/src/types.ts"
    - "code/frameworks/react-vite/src/node/index.ts"
    # @storybook/react root (Meta, StoryObj, Decorator, Preview, composeStories...) and @storybook/react/preview (CSF factories)
    - "code/renderers/react/src/index.ts"
    - "code/renderers/react/src/public-types.ts"
    - "code/renderers/react/src/portable-stories.tsx"
    - "code/renderers/react/src/preview.tsx"
    - "code/renderers/react/src/types.ts"
    # @storybook/addon-docs root (DocsRenderer, DocsTypes) and @storybook/addon-docs/blocks
    - "code/addons/docs/src/index.ts"
    - "code/addons/docs/src/DocsRenderer.tsx"
    - "code/addons/docs/src/types.ts"
    - "code/addons/docs/src/blocks.ts"
    - "code/addons/docs/src/blocks/**"
    # @storybook/addon-a11y root: A11yParameters, A11yGlobals, A11yTypes, A11yReport, PARAM_KEY
    - "code/addons/a11y/src/index.ts"
    - "code/addons/a11y/src/params.ts"
    - "code/addons/a11y/src/types.ts"
    - "code/addons/a11y/src/constants.ts"
    # @storybook/addon-themes root: withThemeByClassName / ByDataAttribute / FromJSXProvider, DecoratorHelpers, ThemesGlobals
    - "code/addons/themes/src/index.ts"
    - "code/addons/themes/src/types.ts"
    - "code/addons/themes/src/decorators/**"
    # @storybook/addon-vitest/vitest-plugin: storybookTest()
    - "code/addons/vitest/src/vitest-plugin/index.ts"
    # @storybook/builder-vite config surface: StorybookConfigVite, BuilderOptions, ViteFinal, ViteBuilder, hasVitePlugins, withoutVitePlugins
    - "code/builders/builder-vite/src/types.ts"
    - "code/builders/builder-vite/src/utils/has-vite-plugins.ts"
    - "code/builders/builder-vite/src/utils/without-vite-plugins.ts"
  amendments:
    - action: "narrowed"
      path: "code/core/src/components/**, code/core/src/babel/**, code/core/src/csf-tools/**, code/core/src/core-server/**, code/core/src/router/**, code/core/src/node-logger/**, code/core/src/telemetry/**, code/core/src/channels/**, code/core/src/builder-manager/**"
      reason: "GAP-005 in test report (2026-04-11 79.68% FAIL). Stratified-scope re-derivation pulled these paths in via the coarse `code/core/**` glob, but they are build/server/addon-UI infrastructure, not story-authoring surface. Narrowing the scope aligns the denominator (~216) with the authoring-surface-only provenance-map baseline and flips Export Coverage from 71.4% to ~99%."
      date: "2026-04-11"
      workflow: "skf-update-skill"
    - action: "tiered"
      path: "scope.tier_a_include"
      reason: "GAP-866 in the SKF 4.0.0 test report (2026-11-02, FAIL): SKF 4.0.0 counts Export Coverage over the whole scope.include union (985 public names, most of them code/core plumbing). A repair that documented all of them was reverted. tier_a_include names the definition files behind the entry points a React+Vite story author imports (280 public names measured with skf-extract-public-api.py), so coverage is measured on the authored surface."
      date: "2026-11-03"
      workflow: "manual"
  notes: |
    1. v10 consolidation: Storybook v10 consolidates prior @storybook/* packages into a single `storybook` package. The 40 exports in code/core are one package's public contract, not 40 sub-packages.

    2. ./internal/* subpath convention: ./internal/* subpaths in `storybook` are declared in package.json `exports` — part of the public contract under granularity B despite the `internal` naming.

    3. Scope assumption — authoring, not installing: Skill serves developers using Storybook for ongoing story authoring (day-90+ author, not day-1 installer). CLI tools (cli-storybook, create-storybook), codemods, eslint-plugin, and csf-plugin are deliberately excluded. `.storybook/main.ts` setup (framework pick, addon registration, Vite integration) is excluded — edited quarterly, covered by T3 supplemental docs.

    4. `preview.ts` is authoring surface, not config: The `Preview` type from @storybook/react-vite and the `preview.ts` patterns (parameters, decorators, globalTypes, loaders) are load-bearing in extraction despite living in `.storybook/`. Edited weekly during story authoring — treated as authoring surface, not one-time setup.

    5. CSF type verification: create-skill MUST verify extraction includes Meta, StoryObj, StoryFn, Decorator, Parameters, ArgTypes, Args from `storybook` — these are load-bearing for every story file.

    6. CSF3 anchor directive (compile-time): Skill must aggressively anchor generated story code to CSF3 syntax (`satisfies Meta<typeof X>`, named-export stories with `args`/`parameters`/`play`). Disambiguate from CSF2 (default export + const stories) — CSF2 is half the internet but invalid v10 style.

    7. Layer mental model directive (compile-time): Skill must document the framework/renderer/builder layer relationship (@storybook/react-vite → @storybook/builder-vite + @storybook/react) so Claude can locate defects in the correct layer (renderer vs. builder vs. framework integration).

    8. Project-state preflight directive (compile-time): Skill entry point must instruct Claude to read the user's `.storybook/main.ts` and `package.json` before answering — discover (a) installed Storybook version, (b) registered addons, (c) framework in use — then consult the API surface. Turns the skill from a static knowledge dump into grounded guidance.

    9. Differentiator / moat: The skill's primary value vs. web search is grounding Claude in Storybook v10's consolidated `storybook` package import surface. Web examples and model training data lag 12-18 months and still show `@storybook/*` sub-package imports — the skill corrects this.

    10. Coverage stratification (SKF 4.0.0): Tier A (`scope.tier_a_include`) is the definition files behind the entry points a React+Vite story author imports: storybook/test, storybook/preview-api, storybook/actions (+ /decorator), storybook/theming (+ /create), storybook/viewport, storybook/highlight, @storybook/react-vite (+ /node), @storybook/react (root + /preview), @storybook/addon-docs (root + /blocks), the @storybook/addon-a11y and @storybook/addon-themes roots, @storybook/addon-vitest/vitest-plugin, and the @storybook/builder-vite config types and plugin helpers. Tier A is the Export Coverage denominator. Tier B is what `scope.include` matches outside Tier A: storybook/internal/* (types, csf, common, docs-tools, cli, core-events, server-errors, preview-errors, instrumenter, mocking-utils, client-logger), storybook/manager-api, addon preset/manager/postinstall entries, the renderer's entry-preview* modules and the builder runtime. It stays in scope for signature lookups and citations and is documented only where a story needs it. Tier C is `scope.exclude`.
