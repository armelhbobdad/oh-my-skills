source_repo: "https://github.com/storybookjs/storybook"
language: "TypeScript"
description: "Authors Storybook v10 stories using the consolidated `storybook` package import surface for React+Vite authoring workflows. Covers CSF3 story authoring, `preview.ts` patterns, the React renderer, Vite builder integration, and 4 essential addons (a11y, docs, themes, vitest). Target user: day-90+ story author, not first-time installer."
forge_tier: "Deep"
created: "2026-04-11"
