# Extraction Rules — oms-cocoindex v0.3.37
# Generated by skf-create-skill step-07 for reproducibility.
#
# Language: python
# Tool: ast-grep 0.42.0 (CLI, `ast-grep run --json=stream`)
# Source commit: 87c5dbf087bfccca83791861db0d33519ef09677
# Source tag: v0.3.37
#
# These rules re-create the extraction performed in step-03. Each rule was
# applied per-file (via explicit file args in the CLI invocation) to the
# source files listed under `in_scope_files` below, then filtered to public
# names by the `^[^_]` regex constraint.

language: python
ast_grep_version: "0.42.0"
extraction_path: "per-file CLI streaming"

rules:
  - id: python-public-functions
    description: "Top-level public def and async def declarations (no leading underscore)"
    pattern: "def $NAME($$$P)"
    constraints:
      NAME:
        regex: "^[^_]"
    note: "ast-grep's `def` pattern also matches `async def` in Python — no separate rule needed."

  - id: python-public-classes
    description: "Top-level public class declarations (no leading underscore)"
    pattern: "class $NAME"
    constraints:
      NAME:
        regex: "^[^_]"
    note: "`class $NAME:` and `class $NAME($$$B):` variants returned zero results on v0.3.37 sources (apparent pattern-parser quirk). The unconstrained `class $NAME` pattern worked reliably when run per-file."

in_scope_files:
  # Primary public-API entry point (defines __all__)
  - "python/cocoindex/__init__.py"

  # Core flow authoring
  - "python/cocoindex/flow.py"
  - "python/cocoindex/lib.py"

  # Operation spec framework
  - "python/cocoindex/op.py"

  # Settings & auth
  - "python/cocoindex/setting.py"
  - "python/cocoindex/auth_registry.py"

  # Indexes, LLM, typing, query handler
  - "python/cocoindex/index.py"
  - "python/cocoindex/llm.py"
  - "python/cocoindex/typing.py"
  - "python/cocoindex/query_handler.py"

  # CLI + utils
  - "python/cocoindex/cli.py"
  - "python/cocoindex/utils.py"

  # Built-in sources
  - "python/cocoindex/sources/__init__.py"
  - "python/cocoindex/sources/_engine_builtin_specs.py"

  # Built-in targets (+ extended target modules)
  - "python/cocoindex/targets/__init__.py"
  - "python/cocoindex/targets/_engine_builtin_specs.py"
  - "python/cocoindex/targets/chromadb.py"
  - "python/cocoindex/targets/lancedb.py"
  - "python/cocoindex/targets/pinecone.py"
  - "python/cocoindex/targets/turbopuffer.py"
  - "python/cocoindex/targets/doris.py"

  # Built-in functions
  - "python/cocoindex/functions/__init__.py"
  - "python/cocoindex/functions/_engine_builtin_specs.py"
  - "python/cocoindex/functions/sbert.py"
  - "python/cocoindex/functions/colpali.py"

scope_type: "public-api"
entry_points:
  - "python/cocoindex/__init__.py"

exclude_patterns:
  - "python/cocoindex/tests/**"
  - "python/cocoindex/_internal/**"
  - "python/cocoindex/_version.py"
  - "python/cocoindex/_version_check.py"
  - "python/cocoindex/_engine.*"
  - "python/cocoindex/engine_value.py"
  - "python/cocoindex/engine_type.py"
  - "python/cocoindex/engine_object.py"
  - "python/cocoindex/subprocess_exec.py"
  - "python/cocoindex/user_app_loader.py"
  - "python/cocoindex/runtime.py"
  - "python/cocoindex/setup.py"
  - "python/cocoindex/validation.py"
  - "rust/**"
  - "Cargo.toml"
  - "Cargo.lock"
  - ".cargo/**"
  - "dev/**"
  - "docs/src/**"
  - "docs/static/**"
  - ".github/**"

promoted_files:
  # Via Authoritative Files Protocol (step-03 §2a)
  - path: "CLAUDE.md"
    heuristic: "CLAUDE.md"
    file_type: "doc"
    content_hash: "sha256:36600de9716617066f2c9ecc8c3dfb88d1607b95bf2412de537946a4b02e4299"

reproducibility_notes:
  - "Clone the repo at commit 87c5dbf087bfccca83791861db0d33519ef09677 (tag v0.3.37)."
  - "Run `ast-grep run -p 'def $NAME($$$P)' -l python --json=stream <file>` per each file in `in_scope_files`."
  - "Filter results to `name` not starting with underscore (same as the NAME constraint above)."
  - "Run the same command with `-p 'class $NAME'` and merge results."
  - "Validate extracted public names against `python/cocoindex/__init__.py.__all__` for the 55-item public-API surface."
