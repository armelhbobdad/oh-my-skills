<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Oh-My-Skills">
  <title>Oh-My-Skills</title>
  <desc>Version-pinned, AST-verified agent skills — every claim carries a commit-hash receipt.</desc>

  <!-- Tag body: dark slate card with amber border -->
  <rect x="12" y="20" width="104" height="88" rx="10"
        fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>

  <!-- Top-left grommet hole: evokes a pinned luggage tag without needing a floating pin -->
  <circle cx="26" cy="34" r="4" fill="none" stroke="#f59e0b" stroke-width="2"/>

  <!-- "oms" wordmark -->
  <text x="64" y="70" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace"
        font-size="28" font-weight="800" fill="#f59e0b" letter-spacing="2">oms</text>

  <!-- Divider -->
  <line x1="26" y1="82" x2="102" y2="82" stroke="#f59e0b" stroke-width="1" opacity="0.35"/>

  <!-- Commit-hash row: real SHA from the pinned oms-cocoindex source (cocoindex v0.3.37) -->
  <text x="54" y="98" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace"
        font-size="10" fill="#94a3b8" letter-spacing="1">87c5dbf0</text>

  <!-- Verified check badge -->
  <g transform="translate(92, 98)">
    <circle r="9" fill="#10b981"/>
    <path d="M-4 0 L-1 3 L4 -3" stroke="#0f172a" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
